name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install build and test dependencies
        run: python -m pip install -r requirements.txt pytest playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run site and browser tests
        run: |
          python scripts/build.py
          python -m pytest -q

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0

      - name: Build and verify static site
        run: |
          python scripts/check.py \
            --base-path "${{ steps.pages.outputs.base_path }}" \
            --site-url "https://${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}" \
            --cname "${{ vars.PAGES_CNAME || 'astrayao.xyz' }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
