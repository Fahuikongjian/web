<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" fill="none">
  <!-- Folk Talisman Red-Thread Network: Ming / Shi / Xing / Si -->
  <rect x="2" y="2" width="236" height="136" rx="10" fill="#111015" stroke="#DFB86B" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- Subtle Bagua & Grid Lines -->
  <circle cx="120" cy="70" r="46" stroke="#DFB86B" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M20 70H220M120 14V126" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Red Folk Threads Connecting 4 Pillars -->
  <path d="M46 36C80 54 96 60 120 70" stroke="#C81E3A" stroke-width="1.6"/>
  <path d="M194 36C160 54 144 60 120 70" stroke="#C81E3A" stroke-width="1.6"/>
  <path d="M46 104C80 86 96 80 120 70" stroke="#C81E3A" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M194 104C160 86 144 80 120 70" stroke="#C81E3A" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M46 36H194M46 104H194" stroke="#DFB86B" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Four Pillar Talisman Slips -->
  <rect x="24" y="20" width="44" height="30" rx="3" fill="#1B161A" stroke="#DFB86B" stroke-opacity="0.65" stroke-width="1.2"/>
  <text x="46" y="40" text-anchor="middle" font-family="serif" font-weight="700" font-size="13" fill="#DFB86B">名</text>

  <rect x="172" y="20" width="44" height="30" rx="3" fill="#1B161A" stroke="#DFB86B" stroke-opacity="0.65" stroke-width="1.2"/>
  <text x="194" y="40" text-anchor="middle" font-family="serif" font-weight="700" font-size="13" fill="#DFB86B">时</text>

  <rect x="24" y="90" width="44" height="30" rx="3" fill="#1B161A" stroke="#C81E3A" stroke-opacity="0.7" stroke-width="1.2"/>
  <text x="46" y="110" text-anchor="middle" font-family="serif" font-weight="700" font-size="13" fill="#FCA5A5">形</text>

  <rect x="172" y="90" width="44" height="30" rx="3" fill="#1B161A" stroke="#C81E3A" stroke-opacity="0.7" stroke-width="1.2"/>
  <text x="194" y="110" text-anchor="middle" font-family="serif" font-weight="700" font-size="13" fill="#FCA5A5">祀</text>

  <!-- Central Cracked Intercalary Seal (61st Node) -->
  <circle cx="120" cy="70" r="18" fill="#1D0C11" stroke="#E12D4B" stroke-width="1.8"/>
  <circle cx="120" cy="70" r="13" stroke="#DFB86B" stroke-opacity="0.55" stroke-width="0.9" stroke-dasharray="2 2"/>
  <text x="120" y="75" text-anchor="middle" font-family="serif" font-weight="800" font-size="14" fill="#FBF5EE">闰</text>
</svg>
