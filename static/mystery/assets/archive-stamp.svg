<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" fill="none">
  <!-- Precession Calibration Committee Vermilion Square Seal -->
  <rect x="6" y="6" width="132" height="132" rx="6" stroke="#B91C1C" stroke-width="4.5" stroke-opacity="0.9"/>
  <rect x="14" y="14" width="116" height="116" rx="3" stroke="#B91C1C" stroke-width="1.5" stroke-opacity="0.72"/>

  <!-- Inner Seal Grid Crosshairs -->
  <line x1="72" y1="14" x2="72" y2="108" stroke="#B91C1C" stroke-opacity="0.42" stroke-width="1.2"/>
  <line x1="14" y1="61" x2="130" y2="61" stroke="#B91C1C" stroke-opacity="0.42" stroke-width="1.2"/>
  <line x1="14" y1="108" x2="130" y2="108" stroke="#B91C1C" stroke-opacity="0.65" stroke-width="1.4"/>

  <!-- Four-Character Seal Layout (Right-to-Left Traditional Order / Clear Legibility) -->
  <text x="43" y="46" text-anchor="middle" font-family="serif" font-weight="800" font-size="25" fill="#B91C1C" fill-opacity="0.92">岁</text>
  <text x="101" y="46" text-anchor="middle" font-family="serif" font-weight="800" font-size="25" fill="#B91C1C" fill-opacity="0.92">差</text>
  <text x="43" y="93" text-anchor="middle" font-family="serif" font-weight="800" font-size="25" fill="#B91C1C" fill-opacity="0.92">校</text>
  <text x="101" y="93" text-anchor="middle" font-family="serif" font-weight="800" font-size="25" fill="#B91C1C" fill-opacity="0.92">正</text>

  <!-- Bottom Committee Bar -->
  <text x="72" y="124" text-anchor="middle" font-family="serif" font-weight="700" font-size="11.5" letter-spacing="2.2" fill="#B91C1C" fill-opacity="0.9">委员会印 · LXJZ-61</text>

  <!-- Natural Antique Ink Distress Cuts -->
  <line x1="28" y1="3" x2="34" y2="18" stroke="#FAF5F0" stroke-opacity="0.42" stroke-width="1.8"/>
  <line x1="114" y1="126" x2="120" y2="141" stroke="#FAF5F0" stroke-opacity="0.42" stroke-width="1.8"/>
  <line x1="3" y1="84" x2="17" y2="80" stroke="#FAF5F0" stroke-opacity="0.35" stroke-width="1.4"/>
</svg>
