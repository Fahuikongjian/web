  <rect width="128" height="128" rx="8" fill="#F2E7D2"/>
  <rect x="7" y="7" width="114" height="114" rx="4" fill="#FBF5E8" stroke="#CBB79B" stroke-width="1.4"/>

  <!-- Aged Masking Tape -->
  <path d="M40 2L88 2L84 14L44 14Z" fill="#D4A95E" fill-opacity="0.52"/>

  <!-- Misty Mountain Night Frame -->
  <rect x="15" y="17" width="98" height="79" rx="2" fill="#232933" stroke="#9E8B74" stroke-width="1"/>
  <path d="M15 70Q38 56 64 67T113 62V96H15V70Z" fill="#323B48"/>
  <path d="M15 80Q45 72 78 82T113 76V96H15V80Z" fill="#1A2029"/>

  <!-- Distant Eerie Pale Paper Nuo Mask Silhouette in the Mist -->
  <path d="M87 38H101L99 52Q94 57 89 52L87 38Z" fill="#EAE2D2" fill-opacity="0.72"/>
  <circle cx="91.5" cy="44" r="1.1" fill="#1A2029"/>
