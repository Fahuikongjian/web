  <path d="M91.5 49Q94 51 96.5 49" stroke="#B91C1C" stroke-opacity="0.75" stroke-width="1"/>

  <!-- Photographer Silhouette & Vintage Twin-Lens / Film Camera -->
  <circle cx="48" cy="54" r="11" fill="#13161C"/>
  <path d="M29 96C31 78 39 70 48 70C57 70 65 78 67 96H29Z" fill="#181C24"/>
  <!-- Camera Strap & Body -->
  <path d="M39 67L43 79M57 67L53 79" stroke="#9C4A3B" stroke-width="2" stroke-linecap="round"/>
  <rect x="40" y="75" width="16" height="12" rx="2" fill="#374151" stroke="#D1C7B7" stroke-width="1"/>
  <circle cx="48" cy="81" r="3.8" fill="#111827" stroke="#DFB86B" stroke-width="1.2"/>
  <circle cx="48" cy="81" r="1.4" fill="#60A5FA" fill-opacity="0.65"/>

  <!-- Bottom Handwritten Stamp -->
  <text x="64" y="111" text-anchor="middle" font-family="monospace" font-size="8.2" letter-spacing="1.2" fill="#6E5A47">山野拾影 · FILM</text>
