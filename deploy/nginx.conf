# ==============================================================================
# 生产级 Nginx 静态站点配置 — ASTRA YAO · 星环手记 (astrayao)
# （适用于阿里云华东 2 上海 ECS + 静态博客 dist/）
#
# 使用方式：
#   1. 将文件中的 astrayao.xyz 替换为你的实际已备案域名及真实后缀（如 astrayao.cn / astrayao.xyz）
#   2. 将静态产物部署至 /var/www/blog/dist
#   3. 复制到 /etc/nginx/conf.d/astrayao.conf（或 /etc/nginx/sites-available/astrayao）
#   4. 执行 `sudo nginx -t && sudo systemctl reload nginx`
#
# 注意：ICP 备案完成前或尚未申请 SSL 证书时，可先启用下方的“备案前/测试期 HTTP 模式”
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP (80) 入口：ACME 证书验证放行 + 全站 301 重定向至 HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name astrayao.xyz www.astrayao.xyz;

    # 允许 Certbot / Let's Encrypt HTTP-01 域名验证
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/blog/dist;
        allow all;
    }

    # 如尚未配置 HTTPS（例如仅使用 IP 调试或刚完成域名解析准备申请证书），
    # 可临时注释下方 return 301，并取消下面 root/location 的注释。
    location / {
        return 301 https://astrayao.xyz$request_uri;
    }

    # --- [备选] 无 HTTPS 临时调试块（请勿与上方 return 301 同时启用） ---
    # root /var/www/blog/dist;
    # index index.html;
    # error_page 404 /404.html;
    # location / {
    #     try_files $uri $uri/ =404;
    # }
}

# ------------------------------------------------------------------------------
# 2. HTTPS (443) www -> 主域名 301 跳转（统一规范域名，避免 SEO 权重分散）
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.astrayao.xyz;

    ssl_certificate     /etc/letsencrypt/live/astrayao.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astrayao.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://astrayao.xyz$request_uri;
}

# ------------------------------------------------------------------------------
# 3. HTTPS (443) 主站生产配置
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name astrayao.xyz;

    root /var/www/blog/dist;
    index index.html;
    charset utf-8;

    # --- SSL/TLS 证书与加密套件（Let's Encrypt / 阿里云免费 SSL 均可） ---
    ssl_certificate     /etc/letsencrypt/live/astrayao.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astrayao.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- 访问与错误日志 ---
    access_log /var/log/nginx/astrayao.access.log;
    error_log  /var/log/nginx/astrayao.error.log warn;

    # --- 自定义 404 页面映射 ---
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- Gzip 压缩（主流 Linux 发行版 Nginx 默认内置） ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # --- Brotli 压缩（可选：仅当 Nginx 已加载 ngx_brotli 模块时取消注释） ---
    # brotli on;
    # brotli_comp_level 6;
    # brotli_min_length 256;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/xml
    #     application/json
    #     application/javascript
    #     application/xml+rss
    #     application/rss+xml
    #     image/svg+xml;

    # --- 全局安全响应头 ---
    # 注意：Nginx 中一旦子 location 使用了 add_header，就会覆盖父级 server 的 add_header，
    # 因此下方设置 Cache-Control 的 location 块均显式重复了安全响应头。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- 静态资源（CSS / JS / SVG / JPG / 字体）：长期缓存策略 ---
    # 说明：当前静态资源采用无哈希路径（/static/...），设 30 天强缓存；
    # 若日后改版需立即强制刷新，可对文件名加版本 query 或在发布时调整为 7d。
    location ^~ /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
        access_log off;
    }

    # --- 搜索索引、文章元数据 JSON 与订阅/爬虫文件：短缓存 ---
    location ~* ^/(api/.*\.json|rss\.xml|sitemap\.xml|robots\.txt)$ {
        expires 10m;
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- HTML 页面：短缓存 / 协商缓存，确保新文章发布后立即可见 ---
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- 目录式干净路由（/, /articles/, /articles/<slug>/, /projects/, /about/） ---
    location / {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    # --- 禁止访问隐藏文件（/.well-known/ 已在 80 端口或按需放行） ---
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
