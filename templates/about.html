<div class="about-shell">
  <header class="about-hero">
    <div class="about-portrait-frame">
      <img src="/static/images/astra-portrait.jpg" alt="" width="640" height="640">
    </div>
    <div class="about-identity">
      <h1 class="about-name">{{author_name}}</h1>
      <div class="lyra-divider" aria-hidden="true">
        <span class="lyra-divider-star"></span>
      </div>
      <p class="about-bio">{{author_bio}}</p>
      <div class="social-links">
        {{social_links_html}}
      </div>
    </div>
  </header>

  <section class="prose about-prose" aria-label="关于">
    {{about_body_html}}
  </section>
</div>
