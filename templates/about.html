<div class="about-shell">
  <header class="about-hero">
    <div class="about-portrait-frame">
      <img src="/static/images/astra-portrait.jpg" alt="天琴座黑胶与金色五线谱徽章" width="640" height="640">
    </div>
    <div>
      <h1 class="about-name">{{author_name}}</h1>
      <p class="about-role">{{author_role}} · {{author_location}}</p>
      <p class="about-bio">{{author_bio}}</p>
      <div class="social-links">
        {{social_links_html}}
      </div>
    </div>
  </header>

  <section class="prose" aria-label="关于与建造说明">
    {{about_body_html}}
  </section>
</div>
