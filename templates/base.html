<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{page_title}}</title>
  <meta name="description" content="{{page_description}}">
  <meta name="site-base-path" content="{{base_path}}">
  <link rel="canonical" href="{{canonical_url}}">
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <link rel="alternate" type="application/rss+xml" title="{{site_title}}" href="/rss.xml">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('blog-theme');
        var theme = (saved === 'dark' || saved === 'light') ? saved : 'dark';
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/prose.css">
  {{extra_head}}
</head>
<body>
  <a class="skip-link" href="#main-content">跳至正文</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-brand" href="/">
        <img class="brand-mark" src="/static/images/favicon.svg" alt="" width="26" height="26">
        <span class="brand-title">{{site_title}}</span>
      </a>

      <nav class="site-nav" aria-label="主导航">
        <a class="nav-link {{nav_home_active}}" href="/">首页</a>
        <a class="nav-link {{nav_articles_active}}" href="/articles/">文章</a>
        <a class="nav-link {{nav_projects_active}}" href="/projects/">项目</a>
        <a class="nav-link {{nav_gallery_active}}" href="/gallery/">图像</a>
        <a class="nav-link {{nav_games_active}}" href="/games/">游戏</a>
        <a class="nav-link {{nav_about_active}}" href="/about/">关于</a>
      </nav>

      <div class="header-actions">
        <button type="button" class="search-trigger" data-search-open aria-label="搜索">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
        </button>

        <button type="button" class="theme-toggle" data-theme-toggle aria-label="切换明暗主题" aria-pressed="true">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>

        <button type="button" class="mobile-menu-btn" data-mobile-menu-toggle aria-label="打开导航菜单" aria-expanded="false" aria-controls="mobile-drawer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <dialog class="mobile-drawer" id="mobile-drawer" data-mobile-drawer aria-label="移动端导航菜单">
    <div class="mobile-drawer-panel">
      <div class="mobile-drawer-header">
        <span class="brand-title">{{site_title}}</span>
        <button type="button" class="icon-btn" data-mobile-drawer-close aria-label="关闭导航菜单">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <nav aria-label="移动端主导航">
        <ul class="mobile-nav-list">
          <li><a class="mobile-nav-link {{nav_home_active}}" href="/">首页</a></li>
          <li><a class="mobile-nav-link {{nav_articles_active}}" href="/articles/">文章</a></li>
          <li><a class="mobile-nav-link {{nav_projects_active}}" href="/projects/">项目</a></li>
          <li><a class="mobile-nav-link {{nav_gallery_active}}" href="/gallery/">图像</a></li>
          <li><a class="mobile-nav-link {{nav_games_active}}" href="/games/">游戏</a></li>
          <li><a class="mobile-nav-link {{nav_about_active}}" href="/about/">关于</a></li>
        </ul>
      </nav>
    </div>
  </dialog>

  <main id="main-content" tabindex="-1">
    {{page_content}}
  </main>

  <footer class="site-footer">
    <div class="container footer-minimal">
      <span class="footer-copy">© {{current_year}} {{author_name}}</span>
      <nav class="footer-links" aria-label="页脚导航">
        <a href="/articles/">文章</a>
        <a href="/projects/">项目</a>
        <a href="/gallery/">图像</a>
        <a href="/games/">游戏</a>
        <a href="/about/">关于</a>
        <a href="/rss.xml">RSS</a>
      </nav>
      {{icp_html}}
    </div>
  </footer>

  <dialog class="search-modal" data-search-modal aria-label="站内文章搜索">
    <div class="search-dialog">
      <div class="search-header">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input class="search-input" type="search" data-search-input placeholder="搜索…" autocomplete="off" spellcheck="false" aria-label="搜索文章" role="combobox" aria-autocomplete="list" aria-controls="site-search-results" aria-expanded="false" autofocus>
        <button type="button" class="search-close-btn" data-search-close aria-label="关闭搜索弹窗">×</button>
      </div>
      <div class="search-results" id="site-search-results" data-search-results role="listbox" aria-label="搜索结果列表"></div>
    </div>
  </dialog>

  <script src="/static/js/theme.js" defer></script>
  <script src="/static/js/search.js?v=3" defer></script>
  <script src="/static/js/main.js?v=4" defer></script>
  {{extra_scripts}}
</body>
</html>
