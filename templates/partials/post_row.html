<article class="post-row" data-tags="{{tags_csv}}">
  <div class="post-row-date">
    <time datetime="{{date}}">{{year}} · {{date_short}}</time>
  </div>
  <div class="post-row-main">
    <h3 class="post-row-title"><a href="{{url}}">{{title}}</a></h3>
    <p class="post-row-summary">{{summary}}</p>
    <div class="tag-list">{{tags_html}}</div>
  </div>
  <div class="post-row-aside">
    <span class="post-row-category">{{category}}</span>
    <span>{{reading_time}} 分钟</span>
  </div>
</article>
