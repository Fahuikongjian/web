  <div class="filter-bar projects-toolbar">
    <div class="filter-pills" role="group" aria-label="按标签筛选项目">
      {{tag_filters_html}}
    </div>
    <p class="projects-count" data-projects-count data-filter-count aria-live="polite">共 {{total_projects}} 项</p>
  </div>

  <div class="projects-grid projects-grid--catalog" data-projects-list data-filter-list data-count-unit="项">
    {{projects_cards_html}}
  </div>

    <svg class="empty-stage-mark" viewBox="0 0 88 56" width="88" height="56" fill="none" aria-hidden="true">
      <circle cx="44" cy="28" r="21" stroke="var(--gold)" stroke-opacity="0.34" stroke-width="1"/>
      <ellipse cx="44" cy="28" rx="38" ry="11" transform="rotate(-14 44 28)" stroke="var(--gold)" stroke-opacity="0.52" stroke-width="1"/>
      <path d="M44 19l1.7 4.3 4.3 1.7-4.3 1.7L44 31l-1.7-4.3L38 25l4.3-1.7Z" fill="var(--accent)"/>
    </svg>
    <p class="search-empty">暂无已发布项目。</p>
  </div>
