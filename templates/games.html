<section class="page-header">
  <div class="container page-header-inner">
    <div class="lyra-ornament" aria-hidden="true">
      <span class="lyra-ornament-line"></span>
      <span class="lyra-ornament-star"></span>
    </div>
    <h1 class="page-title">游戏</h1>
  </div>
</section>

<section class="container page-body" aria-label="网页小游戏">
  <div class="category-bar" data-game-bar>
    <div class="category-tabs" data-game-tabs role="tablist" aria-label="选择游戏">
      <span class="category-indicator" data-game-indicator aria-hidden="true"></span>
      <button type="button" class="category-tab is-active" role="tab" aria-selected="true" data-game-id="2048">
        <span class="category-tab-icon" aria-hidden="true">
          <svg viewBox="0 0 18 18" width="16" height="16" fill="none">
            <rect x="2.5" y="2.5" width="5.5" height="5.5" rx="1.2" stroke="currentColor" stroke-width="1.25"/>
            <rect x="10" y="2.5" width="5.5" height="5.5" rx="1.2" stroke="currentColor" stroke-width="1.25" stroke-opacity="0.7"/>
            <rect x="2.5" y="10" width="5.5" height="5.5" rx="1.2" stroke="currentColor" stroke-width="1.25" stroke-opacity="0.7"/>
            <rect x="10" y="10" width="5.5" height="5.5" rx="1.2" fill="currentColor" fill-opacity="0.85"/>
          </svg>
        </span>
        <span class="category-tab-label">2048</span>
      </button>
      <button type="button" class="category-tab" role="tab" aria-selected="false" data-game-id="snake">
        <span class="category-tab-icon" aria-hidden="true">
          <svg viewBox="0 0 18 18" width="16" height="16" fill="none">
            <path d="M3 12.5H7.5V6.5H12.5V12.5H14.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="14.8" cy="12.5" r="1.4" fill="currentColor"/>
            <path d="M4.2 5.2L4.8 6.5L6.1 7.1L4.8 7.7L4.2 9L3.6 7.7L2.3 7.1L3.6 6.5Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="category-tab-label">贪吃蛇</span>
      </button>
      <button type="button" class="category-tab" role="tab" aria-selected="false" data-game-id="minesweeper">
        <span class="category-tab-icon" aria-hidden="true">
          <svg viewBox="0 0 18 18" width="16" height="16" fill="none">
            <circle cx="9" cy="9.5" r="3.4" stroke="currentColor" stroke-width="1.25"/>
            <path d="M9 3.6V5.4M9 13.6V15.4M3.6 9.5H5.4M12.6 9.5H14.4M5.1 5.6L6.4 6.9M11.6 12.1L12.9 13.4M12.9 5.6L11.6 6.9M6.4 12.1L5.1 13.4" stroke="currentColor" stroke-width="1.15" stroke-linecap="round"/>
            <circle cx="9" cy="9.5" r="1.2" fill="currentColor"/>
          </svg>
        </span>
        <span class="category-tab-label">扫雷</span>
      </button>
      <button type="button" class="category-tab" role="tab" aria-selected="false" data-game-id="breakout">
        <span class="category-tab-icon" aria-hidden="true">
          <svg viewBox="0 0 18 18" width="16" height="16" fill="none">
            <rect x="2.5" y="3" width="5.5" height="2.2" rx="0.8" fill="currentColor" fill-opacity="0.8"/>
            <rect x="10" y="3" width="5.5" height="2.2" rx="0.8" stroke="currentColor" stroke-width="1.1"/>
            <circle cx="9" cy="9.2" r="1.5" fill="currentColor"/>
            <rect x="4.5" y="13.8" width="9" height="1.8" rx="0.9" fill="currentColor"/>
          </svg>
        </span>
        <span class="category-tab-label">打砖块</span>
      </button>
    </div>
  </div>

  <div class="game-stage" data-game-stage aria-live="polite"></div>

  <aside class="mystery-arcade-banner" aria-label="大型沉浸式网页搜证入口">
    <style>
      .mystery-arcade-banner {
        position: relative;
        margin-top: clamp(2rem, 4vw, 3rem);
        padding: clamp(1.35rem, 3vw, 2rem) clamp(1.25rem, 3.2vw, 2.25rem);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-lg);
        background:
          radial-gradient(ellipse at 85% 20%, var(--glow-crimson), transparent 55%),
          radial-gradient(ellipse at 12% 85%, var(--glow-gold), transparent 55%),
          var(--bg-card);
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1.25rem 2rem;
        overflow: hidden;
      }
      .mystery-arcade-banner::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--gold), var(--accent), transparent);
        opacity: 0.78;
      }
      .mystery-arcade-copy {
        flex: 1 1 280px;
        min-width: 0;
      }
      .mystery-arcade-title {
        margin: 0 0 0.45rem;
        font-family: var(--font-serif);
        font-size: clamp(1.25rem, 2.5vw, 1.65rem);
        font-weight: 700;
        color: var(--ink-primary);
        line-height: 1.3;
      }
      .mystery-arcade-desc {
        margin: 0;
        font-size: var(--text-sm);
        color: var(--ink-secondary);
        line-height: 1.65;
        max-width: 60ch;
      }
      .mystery-arcade-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-shrink: 0;
      }
    </style>
    <div class="mystery-arcade-copy">
      <h2 class="mystery-arcade-title">旧网拾遗</h2>
      <p class="mystery-arcade-desc">
        丰宁与澄溪的地方网页存档。收录旧公告、社区帖文和仍可查阅的原版附件。
      </p>
    </div>
    <div class="mystery-arcade-actions">
      <a class="btn btn-primary" href="/mystery/">查看分卷目录</a>
    </div>
  </aside>
</section>
