<div class="home-opening" data-home-opening>
  <div class="home-opening-stage">
    <div class="home-cover">
      <div class="home-cover-backdrop" aria-hidden="true"></div>
      <div class="home-cover-artwork" aria-hidden="true"></div>
      <div class="container home-cover-copy">
        <img class="home-cover-mark" src="/static/images/favicon.svg" alt="" width="42" height="42">
        <p class="home-cover-name">ASTRA YAO</p>
        <p class="home-cover-title">星环手记</p>
      </div>
      <div class="container home-cover-foot">
        <a class="home-cover-enter" href="#home-intro">
          <span>向下滑动</span>
          <svg viewBox="0 0 16 25" width="16" height="25" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
            <path d="M8 1v22m-5-5 5 5 5-5"/>
          </svg>
        </a>
      </div>
    </div>

    <section class="hero-section" id="home-intro" tabindex="-1" aria-labelledby="home-intro-title">
      <div class="container hero-content">
        <div class="hero-eyebrow">{{hero_eyebrow}}</div>
        <h1 class="hero-title" id="home-intro-title">{{hero_title}}</h1>
        <p class="hero-subtitle">{{hero_subtitle}}</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="/articles/">浏览全部文章</a>
          <a class="btn btn-secondary" href="/about/">关于与建造说明</a>
        </div>
        <div class="hero-status-row">
          <div class="now-badge">
            <span class="now-dot" aria-hidden="true"></span>
            <span><strong>Now</strong> · {{now_status}}</span>
          </div>
          <div class="hero-stats">
            <span>{{post_count}} 篇文章</span>
            <span aria-hidden="true">·</span>
            <span>{{tag_count}} 个主题</span>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

{{home_articles_html}}

<section class="section-block" aria-labelledby="section-projects">
  <div class="container">
    <div class="section-header">
      <div>
        <span class="section-kicker">STAGE WORKS · PROJECTS</span>
        <h2 id="section-projects" class="section-title">开源与实验项目</h2>
      </div>
      <a class="section-more" href="/projects/">全部项目 →</a>
    </div>
    <div class="projects-grid">
      {{featured_projects_html}}
    </div>
  </div>
</section>
